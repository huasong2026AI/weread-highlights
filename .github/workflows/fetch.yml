name: 抓取热门划线并更新数据

on:
  # 每天 UTC 02:00（北京时间 10:00）自动跑一次
  schedule:
    - cron: '0 2 * * *'
  # 修改了 watchlist 立即触发
  push:
    paths:
      - 'data/watchlist.txt'
  # 允许在 GitHub 网页上手动点「Run workflow」
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取热门划线
        run: python scripts/fetch_books.py

      - name: 若有更新则提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/books.json data/deleted.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新热门划线数据"
            git push
          fi
